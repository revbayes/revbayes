name: Build and test

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
    - "*"

jobs:
  build:
    strategy:
      matrix:
        name: [ubuntu-gcc-12,
               ubuntu-gcc-12-mpi,
               ubuntu-gcc-13,
               ubuntu-gcc-14,
               ubuntu-gcc-15,
               ubuntu-gcc-15-debugoptimized,
               ubuntu-clang-19,
               macos-xcode-16-intel,
               macos-xcode-26-arm,
               windows
               ]

        include:

          - name: ubuntu-gcc-12
            os: ubuntu-latest
            compiler: gcc
            version: "12"
            mpi: false
            arch: linux64

          - name: ubuntu-gcc-12-mpi
            os: ubuntu-latest
            compiler: gcc
            version: "12"
            mpi: true
            arch: linux64

          - name: ubuntu-gcc-13
            os: ubuntu-latest
            compiler: gcc
            version: "13"
            mpi: false
            arch: linux64
            project: meson

          - name: ubuntu-gcc-14
            os: ubuntu-latest
            compiler: gcc
            version: "14"
            mpi: false
            arch: linux64

          - name: ubuntu-gcc-15
            os: ubuntu-latest
            compiler: gcc
            version: "15"
            mpi: false
            arch: linux64
            image: ubuntu:25.04
            project: meson

          - name: ubuntu-gcc-15-debugoptimized
            os: ubuntu-latest
            compiler: gcc
            version: "15"
            mpi: false
            arch: linux64
            image: ubuntu:25.04
            project: meson
            buildtype: debugoptimized

          - name: ubuntu-clang-19
            os: ubuntu-latest
            compiler: clang
            version: "19"
            mpi: false
            arch: linux64

          - name: macos-xcode-16-intel
            os: macos-15-intel
            compiler: xcode
            version: "16"
            mpi: false
            arch: mac-intel64

          - name: macos-xcode-26-arm
            os: macos-latest
            compiler: xcode
            version: "26"
            mpi: false
            arch: mac-arm64

          - name: windows
            os: ubuntu-24.04
            compiler: idk
            version: "9000"
            mpi: false
            arch: win64
            image: ubuntu:25.04

    runs-on: ${{ matrix.os }}
    container:
      image: ${{ matrix.image || '' }}
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install (Linux)
      if: runner.os == 'Linux' && matrix.name != 'windows'
      run: |
        # If we're running in a docker image, we are already root
        if [ -n "${{ matrix.image }}" ]  ; then
          apt-get update && apt-get install -y sudo build-essential git cmake
        fi 

        sudo apt-get update
        sudo apt-get install -y ccache meson
        if [ "${{ matrix.compiler }}" = "gcc" ]; then
          sudo apt-get install -y g++-${{ matrix.version }}
          echo "C_COMPILER=gcc-${{ matrix.version }}" >> $GITHUB_ENV
          echo "CXX_COMPILER=g++-${{ matrix.version }}" >> $GITHUB_ENV

          echo "CC=ccache gcc-${{ matrix.version }}" >> $GITHUB_ENV
          echo "CXX=ccache g++-${{ matrix.version }}" >> $GITHUB_ENV
        else
          sudo apt-get install -y clang-${{ matrix.version }}
          echo "C_COMPILER=clang-${{ matrix.version }}" >> $GITHUB_ENV
          echo "CXX_COMPILER=clang++-${{ matrix.version }}" >> $GITHUB_ENV

          echo "CC=ccache clang-${{ matrix.version }}" >> $GITHUB_ENV
          echo "CXX=ccache clang++-${{ matrix.version }}" >> $GITHUB_ENV
        fi

    - name: Install (Linux -> Windows [cross])
      if: matrix.name == 'windows'
      run: |
          # If we're running in a docker image, we are already root
          if [ -n "${{ matrix.image }}" ]  ; then
            apt-get update && apt-get install -y sudo build-essential git cmake wget pkgconf
            echo HOME=/root >> "$GITHUB_ENV"
          fi
          sudo apt-get update
          sudo apt-get install -y ccache dos2unix zstd
          sudo apt-get install -y git python3-setuptools python3-pip g++-mingw-w64 wine64

    - name: Select XCode version (macOS)
      if: runner.os == 'macOS'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ matrix.version }}

    - name: Install (macOS)
      if: runner.os == 'macOS'
      run: |
          brew update --auto-update
          # Intel has no bottles for boost or ccache, so Homebrew builds a compiler
          # to compile them. Build boost below, and install a ccache binary before
          # ccache-action: that action runs `brew install ccache` if it finds none.
          if [ "${{ matrix.arch }}" = "mac-intel64" ]; then
            ver=$(brew info --json=v2 boost | jq -r '.formulae[0].versions.stable')
            echo "BOOST_VER=$ver" >> "$GITHUB_ENV"
            echo "BOOST_FROM_SOURCE=true" >> "$GITHUB_ENV"
          else
            brew install boost ccache coreutils meson
          fi

    - name: Cache boost
      if: runner.os == 'macOS' && env.BOOST_FROM_SOURCE == 'true'
      id: boost-cache
      uses: actions/cache@v4
      with:
        path: ~/boost
        key: boost-${{ env.BOOST_VER }}-${{ runner.os }}-${{ runner.arch }}

    - name: Build boost from source
      if: runner.os == 'macOS' && env.BOOST_FROM_SOURCE == 'true' && steps.boost-cache.outputs.cache-hit != 'true'
      run: |
          set -o pipefail
          u=${BOOST_VER//./_}
          curl -fL "https://archives.boost.io/release/${BOOST_VER}/source/boost_${u}.tar.gz" | tar xz
          cd "boost_${u}"
          ./bootstrap.sh --prefix="$HOME/boost" --with-libraries=regex,thread,date_time,serialization
          ./b2 -j"$(sysctl -n hw.ncpu)" toolset=clang link=shared threading=multi variant=release cxxflags="-mmacosx-version-min=11.0" linkflags="-mmacosx-version-min=11.0" install

    - name: Point build at source-built boost
      if: runner.os == 'macOS' && env.BOOST_FROM_SOURCE == 'true'
      run: echo "BOOST_ROOT=$HOME/boost" >> "$GITHUB_ENV"

    - name: Install meson
      run: |
        python3 -mpip install meson ninja

    # Caches for different branches are isolated, so we don't need to put the branch name into the key.
    # The total size for all caches in a repository is 5Gb.

    - name: Install ccache (macOS Intel)
      if: runner.os == 'macOS' && matrix.arch == 'mac-intel64'
      run: |
          set -euo pipefail
          rel=$(curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ github.token }}" \
            https://api.github.com/repos/ccache/ccache/releases/latest)
          case "$(uname -m)" in
            x86_64) arch=x86_64 ;;
            arm64) arch=arm64 ;;
            *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
          esac
          url=$(printf '%s\n' "$rel" | jq -r --arg arch "$arch" '
            (
              [.assets[] | select(.name | endswith("-darwin.tar.gz"))] +
              [.assets[] | select(.name | endswith("-darwin-" + $arch + ".tar.gz"))]
            )[0].browser_download_url // empty
          ')
          if [ -z "$url" ]; then
            echo "No macOS ccache archive in $(printf '%s\n' "$rel" | jq -r .tag_name)" >&2
            exit 1
          fi
          archive=$(basename "$url")
          echo "Installing $archive from $(printf '%s\n' "$rel" | jq -r .tag_name)"
          curl -fL "$url" | tar xz
          mkdir -p "$HOME/.local/bin"
          cp "${archive%.tar.gz}/ccache" "$HOME/.local/bin/ccache"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/ccache" --version

    - name: ccache
      uses: hendrikmuhs/ccache-action@v1.2
      with:
         key: ${{ matrix.name }}-${{ github.ref_name }}
         restore-keys: |
           ${{ matrix.name }}-${{ github.ref_name }}
           ${{ matrix.name }}
         save: ${{ github.event_name == 'push' }}

    - name: Install BOOST (Linux)
      if: runner.os == 'Linux' && matrix.name != 'windows'
      run: |
        # Don't use weird boost version installed by github actions.
        sudo rm -rf /usr/local/share/boost

        # Maybe install a particular boost version.
        if [ -n "${{ matrix.install_boost }}" ] ; then
          sudo apt-get remove libboost-all-dev
          sudo add-apt-repository ppa:mhier/libboost-latest
          sudo apt-get update
          sudo apt-get install -y libboost${{ matrix.install_boost }}-dev
        else
          sudo apt-get install -y libboost-all-dev
        fi

    - name: Install BOOST and set up build (Windows meson cross compile)
      if: matrix.name == 'windows'
      env:
        USE_MPI: ${{ matrix.mpi }}
      run: |
        ${GITHUB_WORKSPACE}/projects/make_winroot.sh -ccache true -gtk true
        ( cd ${GITHUB_WORKSPACE}/projects/meson/ ; ./generate.sh )
        
    - name: Clone and build Tensorphylo
      run: |
        if [ "${{ matrix.name }}" = "windows" ] ; then
            meson_args=--cross-file=win64-cross.txt
        fi
        git clone https://bredelings@bitbucket.org/mrmay/tensorphylo.git
        meson setup tpbuild tensorphylo --prefix=$HOME/local ${meson_args}
        meson install -C tpbuild
        if [ "${{ matrix.name }}" = "windows" ] ; then
            # Get the user profile dir for windows, then find where it is as a Linux path
            USERPROFILE=$(winepath -u $(wine cmd /c echo %USERPROFILE% | tr -d '\r'))
            mkdir $USERPROFILE/.plugins
            cp tpbuild/src/libTensorPhylo.dll $USERPROFILE/.plugins
        elif [ "${{ runner.os }}" = macOS ] ; then
            mkdir ~/.plugins
            cp tpbuild/src/libTensorPhylo.dylib ~/.plugins
        else
            mkdir ~/.plugins
            cp tpbuild/src/libTensorPhylo.so ~/.plugins
        fi

    - name: Configure and build
      if: matrix.name != 'windows'
      env:
        USE_MPI: ${{ matrix.mpi }}
        OSX_VERSION_MIN: "11.0"
      run: |
        if [ ${{ matrix.arch }} = "mac-arm64" ] ; then
          export BOOST_ROOT=/opt/homebrew
        fi

        if [ ${{ runner.os }} = "macOS" ] && [ -n "${OSX_VERSION_MIN}" ]; then
           MIN="-mmacosx-version-min=${OSX_VERSION_MIN}"
           export CFLAGS="$CFLAGS $MIN"
           export CXXFLAGS="$CXXFLAGS $MIN"
           export LDFLAGS="$LDFLAGS $MIN"
        fi

        ccache -p
        ccache -s

        # Check meson setup (but not build)
        echo ::group::Test meson setup
        MESON_ARGS=""

        if [ -n "${{ matrix.buildtype || '' }}" ] ; then
           MESON_ARGS="${MESON_ARGS} -Dbuildtype=${{ matrix.buildtype }}"
        fi
        ./projects/meson/generate.sh -Dprefix=$HOME/local/ -Dmpi=${{ matrix.mpi }}
        meson setup build ${MESON_ARGS}
        echo ::endgroup::

        if [ "${{ matrix.project }}" = "meson" ] ; then
           meson install -C build
        else
           (
              cd projects/cmake
              BUILD_DIR=build exec_name=rb ./build.sh -help2yml true -DCMAKE_CXX_COMPILER_LAUNCHER=ccache -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_INSTALL_PREFIX=$HOME/local -mpi ${{ matrix.mpi }}
              cmake --install build
           )
        fi

        ccache -s

    - name: Configure and build (Windows meson cross compile)
      if: matrix.name == 'windows'
      env:
        BOOST_ROOT: /home/runner/win_root/mingw64/
      run: |
        PREFIX=${HOME}/local
        meson setup build ${GITHUB_WORKSPACE} --prefix=$PREFIX --cross-file=win64-cross.txt -Dstudio=true
        CXX=x86_64-w64-mingw32-g++-posix
        WINROOT=${HOME}/win_root
        ccache -p
        ccache -s
        ninja -C build install -j4
        ccache -s
        cp $($CXX --print-file-name libgcc_s_seh-1.dll)   $PREFIX/bin
        cp $($CXX --print-file-name libstdc++-6.dll)      $PREFIX/bin
        cp $($CXX --print-file-name libssp-0.dll)         $PREFIX/bin
        cp $($CXX --print-file-name libwinpthread-1.dll)  $PREFIX/bin
        cp $($CXX --print-file-name libgomp-1.dll)        $PREFIX/bin
        # Copy all DLLs to get the graphics DLLs.
        cp $WINROOT/mingw64/bin/*.dll                     $PREFIX/bin

        # Don't put the wrapper in the same dir as rb.exe so we don't ship it
        mkdir $HOME/wrapper
        ( echo '#!/bin/bash'
          echo 'export WINEDEBUG=-all'
          echo 'wineserver --kill --wait'   # Avoid connecting to an old wineserver from a previous job.
          echo 'wine ~/local/bin/rb.exe "$@"' ) > $HOME/wrapper/rb
        chmod +x ${HOME}/wrapper/rb

    - name: Test
      env:
        USE_MPI: ${{ matrix.mpi }}
        IS_WINDOWS: ${{ matrix.name == 'windows' }}
      run: |
        export PATH=${HOME}/wrapper:${HOME}/local/bin:$PATH

        echo "\"Hello World\"" | rb
        echo ::group::Test suite
        cd tests

        # Temporary hack to make Mac/ARM work: remove the expected JSON output.
        # On Mac/ARM, the JSON output disagrees in the 16th and 17th digit
        #  with the JSON output on Linux/Intel and Mac/Intel.
        if [ ${{ matrix.arch }} = "mac-arm64" ] || [ ${{ matrix.arch }} = "mac-intel64" ] || [ ${{ matrix.arch }} = "win64" ] ; then
           find . -name '*.json' | xargs rm
        fi

        # Another ugly hack: remove the *.errout file generated for the CBDSP
        # test on macOS and Windows. Apparently, NaN log likelihoods are positive
        # on these platforms but negative on Linux. This might be a bug.
        if [ ${{ matrix.arch }} = "mac-arm64" ] || [ ${{ matrix.arch }} = "mac-intel64" ] || [ ${{ matrix.arch }} = "win64" ] ; then
           rm -f test_CBDSP/output_expected/mcmc_CBDSP.errout
        fi

        if [ ${{ matrix.arch }} = "mac-arm64" ] || [ ${{ matrix.arch }} = "mac-intel64" ] || [ ${{ matrix.arch }} = "win64" ] ; then
           rm -f test_FBD/output_expected/mvFossilTimeSlideUniform_multiple_runs.errout

           # There are some differences on the order of 1.0e-5 in the substitution likelihood between Linux/Intel and Mac/ARM
           rm -rf test_propose_bad_index/output_expected/
        fi

        ./run_integration_tests.sh -mpi ${USE_MPI} -windows ${IS_WINDOWS} rb
        cd
        echo ::endgroup::
        echo ::group::testiphy
        git clone https://gitlab.com/testiphy/testiphy.git
        cd testiphy
        ./testiphy rb
        echo ::endgroup::

    - name: Upload test files if they failed
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: test-results-${{ matrix.name }}
        path: tests/test_*

    - name: Upload testiphy files if they failed
      uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: testiphy-results-${{ matrix.name }}
        path: '~/testiphy'

  notify:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: technote-space/workflow-conclusion-action@v3
    
      - name: Check if Slack secret exists
        id: check_secret
        run: |
          if [ -z "${{ secrets.SLACK_WEBHOOK_URL }}" ]; then
            echo "slack_webhook_exists=false" >> $GITHUB_ENV
          else
            echo "slack_webhook_exists=true" >> $GITHUB_ENV
          fi
    
      - name: Notify Slack
        if: env.slack_webhook_exists == 'true'
        uses: 8398a7/action-slack@v3
        with:
          status: custom
          fields: workflow,commit,repo,ref,author
          custom_payload: |
            {
              username: 'action-slack',
              attachments: [{
                color: '${{ env.WORKFLOW_CONCLUSION }}' === 'success' ? 'good' : '${{ env.WORKFLOW_CONCLUSION }}' === 'failure' ? 'danger' : 'warning',
                text: `${process.env.AS_WORKFLOW} (${process.env.AS_COMMIT}) of ${process.env.AS_REPO}@${process.env.AS_REF} by ${process.env.AS_AUTHOR}: ${{ env.WORKFLOW_CONCLUSION }}`,
              }]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
